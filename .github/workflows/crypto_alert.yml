name: Crypto Alert Bot

on:
  schedule:
    # Se ejecuta cada 15 minutos. GitHub no garantiza el minuto exacto
    # (puede retrasarse unos minutos en horas de mucha carga), pero es
    # suficiente para no perderse el cierre de una vela.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # también puedes lanzarlo a mano desde la pestaña "Actions"

permissions:
  contents: write   # necesario para poder guardar state.json de vuelta en el repo

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el bot (una sola pasada)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Guardar el estado actualizado (state.json)
        run: |
          git config user.name "crypto-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Actualizar estado de señales [skip ci]"
          git push
