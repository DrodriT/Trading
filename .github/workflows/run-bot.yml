name: Run Trading Bot

# IMPORTANTE: este workflow NUNCA instala dependencias — hace
# `docker pull` de la imagen que ya construyó docker-build.yml y la
# ejecuta directamente. Eso hace que cada corrida tarde segundos en
# vez de tener que reinstalar pandas/numpy/ccxt cada vez.
#
# TRIGGERS: este workflow NO tiene `schedule:` (cron de GitHub
# Actions) a propósito. Solo se dispara:
#   1) `repository_dispatch` -> cuando cron-job.org llama a la API
#      de GitHub (ver README, sección "cron-job.org" para la config
#      exacta: URL, método, headers y body que hay que poner en
#      cron-job.org).
#   2) `workflow_dispatch` -> botón "Run workflow" manual en la
#      pestaña Actions, útil para probar sin esperar al cron-job.
on:
  repository_dispatch:
    types: [run-bot]
  workflow_dispatch: {}

# No lanzar dos ejecuciones en paralelo: evita condiciones de carrera
# al escribir state.json/trades.json y al hacer commit+push.
concurrency:
  group: run-trading-bot
  cancel-in-progress: false

permissions:
  contents: write   # necesario para poder commitear el estado actualizado
  packages: read    # necesario para poder hacer `docker pull` de GHCR

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 = historial completo (no shallow clone).
          # Necesario para que el `git pull --rebase` del último paso
          # (commit del estado) funcione de forma fiable si mientras
          # tanto hubo otro push a `main` (ej. un commit manual tuyo
          # en GitHub) — con clonado superficial el rebase podría no
          # encontrar un ancestro común y fallar.
          fetch-depth: 0

      - name: Nombre de imagen en minúsculas (requisito de Docker/GHCR)
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar la última imagen (sin build, sin pip install)
        run: docker pull "${{ env.IMAGE }}:latest"

      - name: Asegurar que existe el directorio de estado
        run: mkdir -p state

      - name: Ejecutar el bot
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/state:/app/state" \
            -e EXCHANGE_ID="${{ vars.EXCHANGE_ID || 'bitget' }}" \
            -e SYMBOLS="${{ vars.SYMBOLS }}" \
            -e TIMEFRAME="${{ vars.TIMEFRAME || '15m' }}" \
            -e LOOKBACK_BARS="${{ vars.LOOKBACK_BARS || '1500' }}" \
            -e STATE_FILE="/app/state/state.json" \
            -e JOURNAL_FILE="/app/state/trades.json" \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_TOKEN }}" \
            -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -e DEBUG="${{ vars.DEBUG }}" \
            "${{ env.IMAGE }}:latest"

      - name: Commit y push del estado actualizado
        run: |
          git config user.name "trading-bot[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json state/trades.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el estado — nada que commitear."
          else
            git commit -m "chore: actualizar estado del bot [skip ci]"
            # Reintenta el push hasta 5 veces: si alguien más hizo push a
            # `main` mientras este job corría (ej. un commit manual en
            # GitHub), `git push` se rechaza ("fetch first"). En vez de
            # fallar el job, se trae lo remoto con rebase (seguro aquí,
            # porque este paso solo toca state/state.json y trades.json)
            # y se reintenta.
            attempt=1
            max_attempts=5
            until git push; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::No se pudo hacer push tras $max_attempts intentos."
                exit 1
              fi
              echo "Push rechazado (intento $attempt/$max_attempts) — hay cambios remotos nuevos. Haciendo rebase y reintentando..."
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
              attempt=$((attempt + 1))
              sleep 3
            done
          fi