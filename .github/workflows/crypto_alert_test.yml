name: Crypto Alert Bot TEST

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot_test (una sola pasada)
        working-directory: bot_test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Guardar el estado actualizado (bot_test/state.json)
        run: |
          git config user.name "crypto-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot_test/state.json
          git diff --quiet --cached || git commit -m "Actualizar estado bot_test [skip ci]"
          git push
