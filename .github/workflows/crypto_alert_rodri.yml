name: Crypto Alert Bot Rodri

on:
  workflow_dispatch: {}

# Evita que dos ejecuciones se solapen: si una corrida ya está en curso,
# la siguiente se ENCOLA (no se cancela) en vez de arrancar en paralelo
# y pelear por el mismo commit de state.json.
concurrency:
  group: crypto-alert-bot-rodri
  cancel-in-progress: false

permissions:
  contents: write
  packages: read   # necesario para poder descargar la imagen de GHCR

jobs:
  check-signals:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/drodrit/trading-bot-rodri:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Ya no hace falta "Instalar Python" ni "Instalar dependencias":
      # la imagen ghcr.io/drodrit/trading-bot-rodri ya trae Python 3.12
      # y todas las dependencias de requirements.txt preinstaladas.

      - name: Ejecutar el bot (una sola pasada)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSWORD: ${{ secrets.BITGET_API_PASSWORD }}
        run: python main.py --once

      - name: Guardar el estado actualizado (state.json)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "crypto-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Actualizar estado del bot [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push falló (intento $i), reintentando..."
            sleep 5
          done
