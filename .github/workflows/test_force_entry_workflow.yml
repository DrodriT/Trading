name: Rodri - Forzar entrada de prueba (Bitget demo)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  force-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar test_force_entry.py
        working-directory: bot_Rodri
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSWORD: ${{ secrets.BITGET_API_PASSWORD }}
        run: python test_force_entry.py