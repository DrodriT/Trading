name: Build bot image

# Reconstruye y publica la imagen en GHCR solo cuando cambia algo que
# afecte al entorno (dependencias o el propio Dockerfile), o manualmente
# con "Run workflow". El bot en sí (crypto_alert_rodri.yml) NO reconstruye
# la imagen, solo la usa.
on:
  push:
    branches: [main]
    paths:
      - "bot_Rodri/requirements.txt"
      - "bot_Rodri/Dockerfile"
      - ".github/workflows/build_bot_image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .bot_Rodri/Dockerfile
          push: true
          tags: ghcr.io/drodrit/trading-bot-rodri:latest
